<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0d14">
<title>Ammar Awad — Connect</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-1:#0b0d14; --bg-2:#12101d; --card:rgba(255,255,255,.05); --card-border:rgba(255,255,255,.1);
    --text:#f3f5f9; --muted:#a0a7b8; --qr-bg:#ffffff;
    --grad-a:#5b8cff; --grad-b:#a25bff;
  }
  @media (prefers-color-scheme: light){
    :root{
      --bg-1:#eef1fb; --bg-2:#fbeefb; --card:rgba(255,255,255,.65); --card-border:rgba(20,22,30,.08);
      --text:#14161f; --muted:#5c6373; --qr-bg:#ffffff;
      --grad-a:#3d6fe0; --grad-b:#8b3de0;
    }
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
  html{height:100%}
  body{
    margin:0; min-height:100dvh; min-height:100vh;
    display:flex; align-items:center; justify-content:center;
    background:radial-gradient(circle at 20% -10%, var(--bg-2), transparent 55%),
               radial-gradient(circle at 100% 100%, var(--bg-2), transparent 45%),
               var(--bg-1);
    color:var(--text);
    font-family:"Space Grotesk",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    padding:max(24px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) max(24px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
    overflow-x:hidden;
  }
  .blob{
    position:fixed; width:min(60vw,420px); height:min(60vw,420px); border-radius:50%;
    filter:blur(70px); opacity:.35; z-index:0; pointer-events:none;
  }
  .blob.a{ top:-10%; left:-15%; background:var(--grad-a); }
  .blob.b{ bottom:-15%; right:-10%; background:var(--grad-b); }

  .card{
    position:relative; z-index:1; width:100%; max-width:440px;
    background:var(--card); border:1px solid var(--card-border);
    backdrop-filter:blur(20px); -webkit-backdrop-filter:blur(20px);
    border-radius:24px; padding:clamp(28px,6vw,44px) clamp(20px,5vw,32px);
    text-align:center; box-shadow:0 20px 60px -20px rgba(0,0,0,.35);
    animation:rise .5s ease-out;
  }
  @keyframes rise{ from{opacity:0; transform:translateY(14px)} to{opacity:1; transform:none} }

  .avatar{
    width:72px; height:72px; margin:0 auto 16px; border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    font-size:26px; font-weight:700; color:#fff;
    background:linear-gradient(135deg,var(--grad-a),var(--grad-b));
  }
  h1{ font-size:clamp(22px,5vw,28px); margin:0 0 4px; letter-spacing:-.01em; }
  .role{ color:var(--muted); font-size:clamp(13px,3.5vw,15px); margin:0 0 6px; }
  .tagline{ font-size:13px; color:var(--muted); margin:0 0 28px; opacity:.8; }

  .qr-grid{ display:flex; gap:14px; justify-content:center; flex-wrap:wrap; margin-bottom:24px; }
  .qr-item{
    background:var(--qr-bg); border-radius:16px; padding:12px; width:140px;
    text-decoration:none; color:#14161f; display:block;
    transition:transform .18s ease, box-shadow .18s ease;
    box-shadow:0 6px 20px -8px rgba(0,0,0,.25);
  }
  .qr-item img{ display:block; width:100%; height:auto; border-radius:8px; }
  .qr-item span{ display:block; margin-top:9px; font-size:12.5px; font-weight:600; }
  @media (hover:hover){
    .qr-item:hover{ transform:translateY(-4px); box-shadow:0 14px 28px -10px rgba(0,0,0,.35); }
  }
  .qr-item:active{ transform:scale(.97); }

  .cta{ display:flex; flex-direction:column; gap:10px; }
  .btn{
    display:flex; align-items:center; justify-content:center; gap:9px;
    text-decoration:none; font-weight:600; font-size:15px;
    border-radius:14px; padding:14px 18px; min-height:48px;
    transition:transform .15s ease, filter .15s ease, background .15s ease;
  }
  .btn svg{ width:18px; height:18px; flex:none; }
  .btn.primary{
    color:#fff; background:linear-gradient(135deg,var(--grad-a),var(--grad-b));
  }
  .btn.secondary{
    color:var(--text); background:transparent; border:1px solid var(--card-border);
  }
  @media (hover:hover){
    .btn:hover{ filter:brightness(1.08); }
    .btn.secondary:hover{ border-color:var(--grad-a); color:var(--grad-a); }
  }
  .btn:active{ transform:scale(.97); }

  @media (prefers-reduced-motion: reduce){
    .card{ animation:none; }
    .qr-item, .btn{ transition:none; }
  }
</style>
</head>
<body>
  <div class="blob a"></div>
  <div class="blob b"></div>

  <main class="card">
    <div class="avatar">AA</div>
    <h1>Ammar Awad</h1>
    <p class="role">Senior Backend Engineer</p>
    <p class="tagline">Great meeting you — let's stay in touch</p>

    <div class="qr-grid">
      <a class="qr-item" href="https://www.linkedin.com/in/aawad6" target="_blank" rel="noopener">
        <img src="https://api.qrserver.com/v1/create-qr-code/?size=240x240&data=https%3A%2F%2Fwww.linkedin.com%2Fin%2Faawad6" alt="LinkedIn QR code" loading="lazy">
        <span>LinkedIn</span>
      </a>
      <a class="qr-item" href="https://drive.google.com/file/d/1E_G1Vobse1hrmlIUkOuPlGUCVx9EWsn7/view" target="_blank" rel="noopener">
        <img src="https://api.qrserver.com/v1/create-qr-code/?size=240x240&data=https%3A%2F%2Fdrive.google.com%2Ffile%2Fd%2F1E_G1Vobse1hrmlIUkOuPlGUCVx9EWsn7%2Fview" alt="Resume QR code" loading="lazy">
        <span>Resume</span>
      </a>
    </div>

    <div class="cta">
      <a class="btn primary" href="https://www.linkedin.com/in/aawad6" target="_blank" rel="noopener">
        <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M20.45 20.45h-3.55v-5.57c0-1.33-.02-3.03-1.85-3.03-1.85 0-2.14 1.45-2.14 2.94v5.66H9.36V9h3.41v1.56h.05c.47-.9 1.63-1.85 3.36-1.85 3.6 0 4.27 2.37 4.27 5.45v6.29zM5.34 7.43a2.06 2.06 0 1 1 0-4.12 2.06 2.06 0 0 1 0 4.12zM7.12 20.45H3.56V9h3.56v11.45z"/></svg>
        LinkedIn
      </a>
      <a class="btn secondary" href="https://drive.google.com/file/d/1E_G1Vobse1hrmlIUkOuPlGUCVx9EWsn7/view" target="_blank" rel="noopener">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/></svg>
        Resume
      </a>
    </div>
  </main>
</body>
</html>

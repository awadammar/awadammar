<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ammar Awad — Connect</title>
<style>
  :root{
    --bg:#0b0d12; --card:#12151c; --text:#eef1f6; --muted:#8b93a3;
    --accent:#4f8cff; --border:#232733;
  }
  @media (prefers-color-scheme: light){
    :root{ --bg:#f5f6f8; --card:#ffffff; --text:#14161c; --muted:#5b6270; --accent:#2f6fed; --border:#e4e6eb; }
  }
  *{box-sizing:border-box}
  body{
    margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
    background:var(--bg); color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    padding:32px 16px;
  }
  .card{
    width:100%; max-width:520px; background:var(--card); border:1px solid var(--border);
    border-radius:20px; padding:40px 32px; text-align:center;
  }
  h1{ font-size:26px; margin:0 0 4px; }
  .role{ color:var(--muted); font-size:15px; margin:0 0 32px; }
  .codes{ display:flex; gap:20px; justify-content:center; flex-wrap:wrap; margin-bottom:28px; }
  .code{
    background:#fff; border-radius:14px; padding:14px; width:150px;
  }
  .code img{ display:block; width:100%; height:auto; border-radius:6px; }
  .code span{ display:block; margin-top:10px; font-size:13px; font-weight:600; color:#14161c; }
  .links{ display:flex; flex-direction:column; gap:10px; }
  .links a{
    display:block; text-decoration:none; color:var(--text); font-weight:600; font-size:15px;
    border:1px solid var(--border); border-radius:10px; padding:12px 16px; transition:border-color .15s, color .15s;
  }
  .links a:hover{ border-color:var(--accent); color:var(--accent); }
</style>
</head>
<body>
  <div class="card">
    <h1>Ammar Awad</h1>
    <p class="role">Senior Backend Engineer</p>

    <div class="codes">
      <div class="code">
        <img src="https://api.qrserver.com/v1/create-qr-code/?size=240x240&data=https%3A%2F%2Fwww.linkedin.com%2Fin%2Faawad6" alt="LinkedIn QR code">
        <span>LinkedIn</span>
      </div>
      <div class="code">
        <img src="https://api.qrserver.com/v1/create-qr-code/?size=240x240&data=https%3A%2F%2Fdrive.google.com%2Ffile%2Fd%2F1E_G1Vobse1hrmlIUkOuPlGUCVx9EWsn7%2Fview" alt="Resume QR code">
        <span>Resume</span>
      </div>
    </div>

    <div class="links">
      <a href="https://www.linkedin.com/in/aawad6" target="_blank" rel="noopener">LinkedIn ↗</a>
      <a href="https://drive.google.com/file/d/1E_G1Vobse1hrmlIUkOuPlGUCVx9EWsn7/view" target="_blank" rel="noopener">Resume ↗</a>
    </div>
  </div>
</body>
</html>
